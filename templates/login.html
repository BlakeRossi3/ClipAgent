{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="login card">
  <h1>Sign in</h1>
  <p class="muted">Enter the dashboard token (<code>DASHBOARD_TOKEN</code> in <code>config.env</code>). You stay signed in on this device for 30 days.</p>
  {% if error %}<p class="alert alert-critical" role="alert"><span class="pill-icon" aria-hidden="true">✕</span>{{ error }}</p>{% endif %}
  <form method="post" action="/dashboard/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field"><span>Token</span><input type="password" name="token" autocomplete="current-password" required autofocus></label>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
