[project]
name = "clipagent"
version = "0.1.0"
description = "Auto Shorts Agent: clips licence-safe footage into YouTube Shorts, learns from analytics, phones the owner."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
]
